<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - EduManage</title>


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center">


    <!-- ================= LOGIN CONTAINER ================= -->

    <div class="w-full max-w-md px-4">

        <div class="bg-white rounded-2xl shadow-lg p-8">


            <!-- Logo -->

            <div class="text-center mb-8">

                <div class="flex justify-center mb-4">

                    <div class="w-20 h-20 bg-blue-100
                                text-blue-600 rounded-full
                                flex items-center justify-center">

                        <i class="fa-solid fa-graduation-cap text-4xl"></i>

                    </div>

                </div>


                <h1 class="text-3xl font-bold text-gray-800">
                    EduManage
                </h1>


                <p class="text-gray-500 mt-2">
                    Education Management System
                </p>

            </div>


            <!-- Login Heading -->

            <div class="mb-6">

                <h2 class="text-xl font-semibold text-gray-800">
                    Welcome Back
                </h2>

                <p class="text-gray-500 text-sm mt-1">
                    Login to access EduManage
                </p>

            </div>


            <!-- Login Form -->

            <form id="login-form">


                <!-- Email -->

                <div class="mb-4">

                    <label for="login-email"
                           class="block text-sm font-medium
                                  text-gray-700 mb-1">

                        Email

                    </label>


                    <div class="relative">

                        <i class="fa-solid fa-envelope
                                  absolute left-3 top-3
                                  text-gray-400"></i>

                        <input type="email"
                               id="login-email"
                               required
                               placeholder="Enter your email"
                               class="w-full border border-gray-300
                                      rounded-lg pl-10 pr-3 py-2.5
                                      focus:outline-none
                                      focus:ring-2
                                      focus:ring-blue-500">

                    </div>

                </div>


                <!-- Password -->

                <div class="mb-4">

                    <label for="login-password"
                           class="block text-sm font-medium
                                  text-gray-700 mb-1">

                        Password

                    </label>


                    <div class="relative">

                        <i class="fa-solid fa-lock
                                  absolute left-3 top-3
                                  text-gray-400"></i>

                        <input type="password"
                               id="login-password"
                               required
                               placeholder="Enter your password"
                               class="w-full border border-gray-300
                                      rounded-lg pl-10 pr-3 py-2.5
                                      focus:outline-none
                                      focus:ring-2
                                      focus:ring-blue-500">

                    </div>

                </div>


                <!-- Error Message -->

                <p id="login-error"
                   class="hidden text-red-500 text-sm mb-4">
                </p>


                <!-- Login Button -->

                <button type="submit"
                        class="w-full bg-blue-600
                               hover:bg-blue-700
                               text-white font-medium
                               py-2.5 rounded-lg
                               transition">

                    <i class="fa-solid fa-right-to-bracket mr-2"></i>

                    Login

                </button>


            </form>


            <!-- Demo Credentials -->

            <div class="mt-6 bg-gray-50
                        border border-gray-200
                        rounded-lg p-4">

                <p class="text-sm font-medium text-gray-700">
                    Demo Login
                </p>

                <p class="text-xs text-gray-500 mt-2">
                    Email: admin@edumanage.com
                </p>

                <p class="text-xs text-gray-500 mt-1">
                    Password: admin123
                </p>

            </div>


            <!-- Footer -->

            <p class="text-center text-xs text-gray-400 mt-6">
                EduManage &copy; 2026
            </p>


        </div>

    </div>


    <!-- Login JavaScript -->

    <script src="js/login.js"></script>

</body>

</html>
